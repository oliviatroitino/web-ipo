  <script>
    /* Toggle del nav: actualiza aria-expanded y etiqueta */
    const navToggle = document.getElementById('nav-toggle');
    if (navToggle) {
      navToggle.addEventListener('click', () => {
        const open = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!open));
        navToggle.setAttribute('aria-label', open ? 'Abrir menú' : 'Cerrar menú');
      });
    }

    /* Botones favorito: toggle aria-pressed y anuncio via aria-live */
    document.querySelectorAll('.js-favorito').forEach(btn => {
      btn.addEventListener('click', () => {
        const pressed = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', String(!pressed));
        btn.textContent = !pressed ? 'Guardado' : 'Guardar';

        let live = document.getElementById('aria-live-region');
        if (!live) {
          live = document.createElement('div');
          live.id = 'aria-live-region';
          live.setAttribute('aria-live','polite');          live.style.left = '-9999px';
          document.body.appendChild(live);
        }
        live.textContent = btn.getAttribute('aria-pressed') === 'true' ? 'Añadido a favoritos' : 'Eliminado de favoritos';
      });
    });

    /* Opciones de filtro: soporte teclado (Space/Enter) y toggle aria-checked */
    document.querySelectorAll('.filter-option').forEach(el => {
      el.addEventListener('click', () => {
        const checked = el.getAttribute('aria-checked') === 'true';
        el.setAttribute('aria-checked', String(!checked));
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); el.click(); }
      });
    });

    /* Marcar iconos/elementos decorativos para que AT los ignore */
    document.querySelectorAll('svg, .icon, i[data-lucide]').forEach(ic => {
      if (!ic.hasAttribute('aria-hidden')) ic.setAttribute('aria-hidden','true');
    });
  </script>
