<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe detalle móvil v3 — Pasos primero</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f1efe8;padding:32px;display:flex;justify-content:center}
.frame{background:#fff;border:1px solid #e4e2db;border-radius:12px;overflow:hidden;font-size:13px;width:320px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e4e2db}
.topbar-left{display:flex;align-items:center;gap:8px}
.back-btn{width:28px;height:28px;border-radius:8px;border:1px solid #e4e2db;display:flex;align-items:center;justify-content:center;font-size:13px;color:#1a1a18}
.topbar-title{font-size:14px;font-weight:600;color:#1a1a18}
.topbar-right{display:flex;gap:6px}
.icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid #e4e2db;display:flex;align-items:center;justify-content:center;font-size:13px;color:#1a1a18}
.content{padding:14px}
.breadcrumb{font-size:11px;color:#a3a39d;margin-bottom:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid}
.chip-blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.chip-green{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.chip-amber{background:#fefce8;color:#854d0e;border-color:#fde68a}
.compare-btn{width:100%;padding:9px;border:1px solid #e4e2db;border-radius:8px;font-size:13px;font-weight:500;color:#1a1a18;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:999px;border:1px solid #e4e2db;font-size:11px;color:#6b6b65}
.tab.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
.section{border:1px solid #e4e2db;border-radius:8px;margin-bottom:8px;overflow:hidden}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;font-size:13px;font-weight:600;color:#1a1a18}
.section-body{background:#f9f8f6;padding:10px 11px;border-top:1px solid #e4e2db}
.step{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.step:last-child{margin-bottom:0}
.step-num{width:20px;height:20px;border-radius:50%;background:#1a1a18;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-lines{flex:1}
.line{height:7px;border-radius:4px;background:#c9c6bc;margin-bottom:5px}
.line.dark{background:#1a1a18}
.footer{border-top:1px solid #e4e2db;padding:9px 14px;display:flex;justify-content:space-between;font-size:11px;color:#a3a39d}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="topbar-left">
      <div class="back-btn"><i class="ti ti-arrow-left"></i></div>
      <span class="topbar-title">Card Sorting</span>
    </div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-heart"></i></div>
      <div class="icon-btn"><i class="ti ti-download"></i></div>
    </div>
  </div>
  <div class="content">
    <div class="breadcrumb">Inicio › Evaluación › Card Sorting</div>
    <div class="chips">
      <span class="chip chip-blue">Inspección</span>
      <span class="chip chip-green">Análisis</span>
      <span class="chip chip-amber">Bajo coste</span>
    </div>
    <div class="compare-btn"><i class="ti ti-arrows-exchange"></i> Comparar</div>
    <div class="tabs">
      <span class="tab active">Pasos</span>
      <span class="tab">Descripción</span>
      <span class="tab">Recursos</span>
      <span class="tab">Descargas</span>
    </div>
    <div class="section">
      <div class="section-hdr"><span>Pasos</span><i class="ti ti-chevron-up"></i></div>
      <div class="section-body">
        <div class="step"><div class="step-num">1</div><div class="step-lines"><div class="line dark" style="width:72%"></div><div class="line" style="width:90%"></div></div></div>
        <div class="step"><div class="step-num">2</div><div class="step-lines"><div class="line dark" style="width:60%"></div><div class="line" style="width:80%"></div></div></div>
      </div>
    </div>
    <div class="section"><div class="section-hdr"><span>Descripción</span><i class="ti ti-chevron-down"></i></div></div>
    <div class="section"><div class="section-hdr"><span>Recursos</span><i class="ti ti-chevron-down"></i></div></div>
    <div class="section"><div class="section-hdr"><span>Descargas</span><i class="ti ti-chevron-down"></i></div></div>
  </div>
  <div class="footer"><span>© 2026 Grupo 7</span><span>Ayuda</span></div>
</div>
</body>
</html>
