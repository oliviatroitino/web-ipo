id: card-sorting
nombre: Card sorting

clasificacion: Prueba

fases:
  - Descubrimiento
  - Prototipado

duracion: media

recursos: medio

costo_monetario: bajo

num_usuarios_min: 15
num_usuarios_max: 0

materiales:
  - Tarjetas físicas o software online de card sorting
  - Tablero o mesa (si es presencial)
  - Matriz de análisis (Excel/Hoja de cálculo)
  - Grabadora de audio o vídeo (opcional)

tiempos_detalle:
  - fase: Preparación
    tiempo: 4 horas
  - fase: Reclutamiento de participantes
    tiempo: 5 horas
  - fase: Ejecución
    tiempo: 8 horas
  - fase: Análisis de resultados
    tiempo: 6 horas

para_que_sirve:
  - Diseñar la arquitectura de la información de un sitio web.
  - Entender el modelo mental de los usuarios y cómo agrupan conceptos de forma natural.
  - Definir la estructura de menús de navegación, categorías y etiquetas.
  - Validar si la organización actual de un producto es intuitiva para la audiencia.

para_que_no_sirve:
  - Definir la disposición visual o el diseño de la interfaz.
  - Evaluar la usabilidad general de la navegación o si los usuarios se pierden.
  - Descubrir necesidades profundas del usuario o flujos complejos de tareas.

pasos:
  - numero: 1
    titulo: Selección del dominio y preparación de tarjetas
    descripcion: Identificar los contenidos o conceptos clave del sitio web y escribir cada uno en una tarjeta individual de forma clara.
  - numero: 2
    titulo: Reclutamiento y sesión con participantes
    descripcion: Reunir a los usuarios y pedirles que agrupen las tarjetas según su propio criterio lógico (abierto) o en categorías predefinidas (cerrado).
  - numero: 3
    titulo: Análisis estadístico de similitud
    descripcion: Introducir los datos en una matriz para identificar patrones comunes de agrupación y diseñar la estructura final basada en los resultados más repetidos.

resultado: Un mapa de arquitectura de la información optimizado y una propuesta de árbol de navegación que ha sido validada por los usuarios.

dimensiones_usabilidad:
  - Facilidad de aprendizaje
  - Eficiencia
